<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NOLGIA</title>
    <link rel="stylesheet" href="css/panel.css" />
  </head>
  <body>
    <div class="head">
      <span class="brand">NOLGIA</span>
      <span class="app" id="app"></span>
    </div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">NOLGIA is starting...</span></div>
    <div id="top"></div>
    <!-- Requests waiting for an answer float over the top of the panel
         (js/panel.js: they never push the panel down under a click). -->
    <div class="requests" id="requests"></div>
    <!-- The chat is built once and updated in place, so the box keeps what
         you typed (and its focus) while the rest of the panel redraws. -->
    <div class="card chat hidden" id="chat">
      <div class="chat-head">
        <span class="heading">NOLGIA Agent</span>
        <button class="button small hidden" id="chat-new">New chat</button>
      </div>
      <div class="hidden" id="chat-intro">
        <div class="lead" id="chat-lead"></div>
        <div class="label">Try one of these:</div>
        <div id="chat-examples"></div>
      </div>
      <div class="thread hidden" id="chat-thread"></div>
      <div class="working hidden" id="chat-working"></div>
      <div class="notice hidden" id="chat-notice">
        <div id="chat-notice-text"></div>
        <button class="button small hidden" id="chat-notice-action"></button>
      </div>
      <div class="notice hidden" id="chat-blocker">
        <div id="chat-blocker-text"></div>
        <button class="button small" id="chat-fix"></button>
      </div>
      <textarea class="chat-input" id="chat-input" rows="3"></textarea>
      <div class="row chat-buttons">
        <button class="button hidden" id="chat-stop">Stop</button>
        <button class="button primary" id="chat-send">Send</button>
      </div>
      <div class="cost" id="chat-cost"></div>
      <div class="link hidden" id="chat-open-web">Open this chat on nolgia.ai</div>
    </div>
    <div id="main"></div>
    <script src="js/cep.js"></script>
    <script src="js/panel.js"></script>
  </body>
</html>
